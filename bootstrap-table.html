<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bootstrap Table</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="bootstrap-table.css">
</head>
<body class="bg-light">
<div class="container py-5">
  <h2 class="text-center text-primary mb-4">Bootstrap Table Example</h2>
  <table class="table table-striped table-hover shadow-sm">
    <thead class="table-primary"><tr><th>#</th><th>Name</th><th>Email</th><th>Status</th></tr></thead>
    <tbody>
      <tr><td>1</td><td>Yash</td><td>yash@example.com</td><td>Active</td></tr>
      <tr><td>2</td><td>Riya</td><td>riya@example.com</td><td>Inactive</td></tr>
      <tr><td>3</td><td>Aman</td><td>aman@example.com</td><td>Pending</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
