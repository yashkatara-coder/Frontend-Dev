<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bootstrap Cards</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="bootstrap-cards.css">
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="">
        <div class="card-body">
          <h5 class="card-title">Card Title</h5>
          <p class="card-text">Bootstrap cards provide a flexible content container.</p>
          <a href="#" class="btn btn-primary">Read More</a>
        </div>
      </div>
    </div>
    <div class="col-md-4"><div class="card shadow-sm"><img src="https://via.placeholder.com/300x200"><div class="card-body"><h5>Another</h5><p>Simple example of card.</p></div></div></div>
    <div class="col-md-4"><div class="card shadow-sm"><img src="https://via.placeholder.com/300x200"><div class="card-body"><h5>Third Card</h5><p>Clean and responsive.</p></div></div></div>
  </div>
</div>
</body>
</html>
