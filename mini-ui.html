<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Mini UI</title>
  <link rel="stylesheet" href="mini-ui.css"/>
</head>
<body>
  <header class="top">
    <div class="logo">MyApp</div>
    <nav><a href="#">Home</a><a href="#">Features</a><a href="#">Contact</a></nav>
  </header>

  <main class="main">
    <section class="card">
      <h2>Contact Form</h2>
      <form class="form">
        <input type="text" placeholder="Name" required />
        <input type="email" placeholder="Email" required />
        <div class="row">
          <button class="btn primary">Submit</button>
          <button class="btn outline" type="reset">Reset</button>
        </div>
      </form>
    </section>

    <aside class="side">
      <img src="small.jpg" alt="small" />
      <p>Short widget content</p>
    </aside>
  </main>

  <footer>© 2025 Mini UI</footer>
</body>
</html>
