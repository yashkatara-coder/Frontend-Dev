<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bootstrap Typography</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="bootstrap-typography.css">
</head>
<body class="bg-light">
<div class="container py-5">
  <h1 class="display-4 text-center text-primary mb-3">Typography Demo</h1>
  <p class="lead text-center">Bootstrap provides responsive typography utilities.</p>
  <hr>
  <h2>Heading h2</h2>
  <p class="fs-5">This text uses Bootstrap font size utilities like <code>.fs-5</code>.</p>
  <blockquote class="blockquote text-center mt-4">
    <p class="mb-0">"Design is intelligence made visible."</p>
    <footer class="blockquote-footer">Alina Wheeler</footer>
  </blockquote>
</div>
</body>
</html>
