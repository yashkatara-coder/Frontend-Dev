<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tooltip Demo</title>
  <link rel="stylesheet" href="tooltip-demo.css" />
</head>
<body>
  <main class="center">
    <h1>CSS Tooltips</h1>

    <div class="icons">
      <div class="tt-item">
        <span class="icon">💡</span>
        <span class="tooltip">Tip: Use semantic tags</span>
      </div>

      <div class="tt-item">
        <span class="icon">📎</span>
        <span class="tooltip">Attach files</span>
      </div>

      <div class="tt-item">
        <span class="icon">⚙️</span>
        <span class="tooltip">Settings</span>
      </div>
    </div>
  </main>
</body>
</html>
