<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Responsive Filter Gallery</title>
  <link rel="stylesheet" href="responsive-filter-gallery.css" />
</head>
<body>
  <header><h1>Filter Gallery</h1></header>
  <main class="grid">
    <figure>
      <img src="img1.jpg" alt="Image 1" class="f-blur">
      <figcaption>Blur</figcaption>
    </figure>
    <figure>
      <img src="img2.jpg" alt="Image 2" class="f-grayscale">
      <figcaption>Grayscale</figcaption>
    </figure>
    <figure>
      <img src="img3.jpg" alt="Image 3" class="f-sepia">
      <figcaption>Sepia</figcaption>
    </figure>
    <figure>
      <img src="img4.jpg" alt="Image 4" class="f-bright">
      <figcaption>Bright</figcaption>
    </figure>
    <figure>
      <img src="img5.jpg" alt="Image 5" class="f-contrast">
      <figcaption>Contrast</figcaption>
    </figure>
    <figure>
      <img src="img6.jpg" alt="Image 6" class="f-hue">
      <figcaption>Hue Rotate</figcaption>
    </figure>
  </main>
  <footer>© Responsive Gallery</footer>
</body>
</html>
