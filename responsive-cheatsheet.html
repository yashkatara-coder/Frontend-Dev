<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Responsive CSS Cheat Sheet</title>
  <link rel="stylesheet" href="responsive-cheatsheet.css" />
</head>
<body>
  <header><h1>Responsive CSS Cheat Sheet</h1></header>
  <main class="grid">
    <section class="card"><h3>Filters</h3><p>filter: grayscale(100%)</p></section>
    <section class="card"><h3>Media Queries</h3><p>@media (max-width:600px) { ... }</p></section>
    <section class="card"><h3>Flexbox</h3><p>display:flex; align-items:center;</p></section>
    <section class="card"><h3>Grid</h3><p>grid-template-columns: repeat(3,1fr)</p></section>
    <section class="card"><h3>Typography</h3><p>font-size: clamp(1rem,2vw,1.25rem)</p></section>
  </main>
</body>
</html>
