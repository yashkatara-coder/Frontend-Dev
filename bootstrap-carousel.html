<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bootstrap Carousel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="bootstrap-carousel.css">
</head>
<body>
<div id="myCarousel" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active"><img src="https://via.placeholder.com/1200x400?text=Slide+1" class="d-block w-100"><div class="carousel-caption"><h5>First Slide</h5></div></div>
    <div class="carousel-item"><img src="https://via.placeholder.com/1200x400?text=Slide+2" class="d-block w-100"><div class="carousel-caption"><h5>Second Slide</h5></div></div>
    <div class="carousel-item"><img src="https://via.placeholder.com/1200x400?text=Slide+3" class="d-block w-100"><div class="carousel-caption"><h5>Third Slide</h5></div></div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
  <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
